ry":"测试配置","role":"配置 root 的 vitest.base 测试执行环境和匹配范围","evidence":"导出：workspaceSourcePaths"}]</script><script>const files=JSON.parse(document.getElementById('data').textContent);const q=document.getElementById('query'),g=document.getElementById('group'),k=document.getElementById('kind'),list=document.getElementById('results'),more=document.getElementById('more');for(const [el,key] of [[g,'group'],[k,'category']])for(const v of [...new Set(files.map(x=>x[key]))].sort()){const o=document.createElement('option');o.value=v;o.textContent=v;el.append(o)}let limit=80;function render(reset){if(reset)limit=80;const needle=q.value.trim().toLowerCase();const found=files.filter(f=>(!g.value||f.group===g.value)&&(!k.value||f.category===k.value)&&(!needle||[f.path,f.role,f.evidence].join(' ').toLowerCase().includes(needle)));list.replaceChildren();for(const f of found.slice(0,limit)){const row=document.createElement('article');row.className='file';const a=document.createElement('a');a.href='../../'+f.path.split('/').map(encodeURIComponent).join('/');a.textContent=f.path;const tag=document.createElement('span');tag.className='tag';tag.textContent=f.category;const p=document.createElement('p');p.textContent=f.role;const small=document.createElement('small');small.textContent=f.evidence;row.append(a,tag,p,small);list.append(row)}document.getElementById('status').textContent='找到 '+found.length+' / '+files.length+' 个文件 · 已显示 '+Math.min(limit,found.length);more.hidden=found.length<=limit}q.addEventListener('input',()=>render(true));g.addEventListener('change',()=>render(true));k.addEventListener('change',()=>render(true));more.addEventListener('click',()=>{limit+=80;render(false)});render(true);</script></html>
