name: Rust dependency audit
on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      # Pinned standalone CI tool; never rewrites the application's Cargo.lock.
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked --version 0.22.2 --no-default-features
      - name: Audit pinned dependencies
        run: cargo audit --file Cargo.lock
